<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Support Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Floating Launcher Button -->
  <button id="chat-launcher" onclick="toggleChat()" aria-label="Open Chat">
    <div class="glow-effect"></div>
    <i data-lucide="sparkles" class="icon-sparkles"></i>
    <span>Chat with AI</span>
  </button>

  <!-- Chat Widget Container -->
  <div id="chat-card" class="chat-hidden">
    
    <!-- Card Header -->
    <div class="chat-header">
      <div class="brand">
        <div class="avatar-glow">
          <i data-lucide="bot"></i>
        </div>
        <div class="brand-info">
          <h4>Groq AI Assistant</h4>
          <span class="status-badge"><span class="pulse"></span> Online</span>
        </div>
      </div>
      <button class="close-btn" onclick="toggleChat()"><i data-lucide="x"></i></button>
    </div>

    <!-- Messages Container -->
    <div id="chat-messages">
      <div class="msg bot-msg">
        Hello! 👋 How can I help you today?
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-wrapper">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Ask anything..." 
        onkeypress="handleKeyPress(event)"
        autocomplete="off"
      />
      <button id="send-btn" onclick="sendMessage()">
        <i data-lucide="send"></i>
      </button>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();
  </script>
</body>
</html>
