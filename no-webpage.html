<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Downloading...</title>
</head>
<body>
    <script>
        const a = document.createElement('a');
        a.href = 'abcd.jpeg';
        a.download = 'abcd.jpeg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    </script>
</body>
</html>
